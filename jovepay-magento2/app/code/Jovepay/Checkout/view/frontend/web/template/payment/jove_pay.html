<div class="payment-method jovepay-checkout-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label data-bind="attr: {'for': getCode()}" class="label jovepay-checkout-payment-method-label">
            <img class="jovepay-checkout-payment-icons__logo"
                 alt=""
                 data-bind="attr: { src: require.toUrl('Jovepay_Checkout/images/jovepay.svg'), alt: $t('JOVEpay') }"/>
            <span class="jovepay-checkout-payment-method-label__text" data-bind="text: getTitle()"></span>
            <span class="jovepay-checkout-payment-icons" aria-hidden="true">
                <span class="jovepay-checkout-payment-icons__stack">
                    <img class="jovepay-checkout-payment-icons__coin"
                         alt=""
                         style="z-index: 4"
                         data-bind="attr: { src: require.toUrl('Jovepay_Checkout/images/coins/btc.png'), alt: $t('Bitcoin') }"/>
                    <img class="jovepay-checkout-payment-icons__coin"
                         alt=""
                         style="z-index: 3"
                         data-bind="attr: { src: require.toUrl('Jovepay_Checkout/images/coins/eth.png'), alt: $t('Ethereum') }"/>
                    <img class="jovepay-checkout-payment-icons__coin"
                         alt=""
                         style="z-index: 2"
                         data-bind="attr: { src: require.toUrl('Jovepay_Checkout/images/coins/usdt.png'), alt: $t('Tether') }"/>
                    <img class="jovepay-checkout-payment-icons__coin"
                         alt=""
                         style="z-index: 1"
                         data-bind="attr: { src: require.toUrl('Jovepay_Checkout/images/coins/bnb.png'), alt: $t('BNB') }"/>
                </span>
            </span>
        </label>
    </div>
    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!-- /ko -->
        <fieldset class="fieldset" data-bind="attr: {id: 'payment_form_' + getCode()}">
            <div class="payment-method-note">
                <span data-bind="text: getRedirectionText()"></span>
            </div>
        </fieldset>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!-- /ko -->
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="
                            click: placeOrder,
                            enable: (getCode() == isChecked()),
                            attr: {title: $t('Continue')},
                            css: {disabled: !isPlaceOrderActionAllowed()}
                        ">
                    <span data-bind="i18n: 'Continue'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
